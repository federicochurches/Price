<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Supply Optimization · {{WEEK_NUM}} · {{MES_AÑO}}</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════════════════════
   SUPPLY HEAD · Variables base + scoping CR/RND
   Variables de acento van por sección, no en :root global
   ══════════════════════════════════════════════════════════ */
:root {
  --paper:#F8F4EC; --paper-soft:#F2EDE0;
  --ink:#161616;   --ink-soft:#4A4A4A; --ink-muted:#8A8377;
  --rule:#C9C1B0;  --rule-soft:#D9D2C1;
  --amber:#FCD34D; --amber-soft:#FEF9C3;
  --green:#1A6B4A; --green-soft:#E1F5EE;
  --navy:#161616;  --navy-soft:#F2EEE6;
  --red:#C0392B;   --red-soft:#FCE4F1;
  --maxw:1280px;
  /* Accent por defecto: neutro hasta que entra el scope */
  --accent:#333132; --accent-soft:#F2EEE6;
}

/* ── Scope CR (violet) ─────────────────────────── */
.section-cr {
  --accent:#5C469C; --accent-soft:#EDE8F7;
  --amber:#FCD34D;  --amber-soft:#FEF9C3;
}

/* ── Scope RND (magenta) ───────────────────────── */
.section-rnd {
  --accent:#EA0074; --accent-soft:#FCE4F1;
  --amber:#EA0074;  --amber-soft:#FCE4F1;
  --red:#EA0074;    --red-soft:#FCE4F1;
}

/* ── Tabs KPI Hero · CR · Eficacia (tab-ef-*) ── */
.section-cr #tab-ef-destino:checked ~ .tab-panels .tab-panel[data-tab="destino"],
.section-cr #tab-ef-corp:checked ~ .tab-panels .tab-panel[data-tab="corp"],
.section-cr #tab-ef-hotel:checked ~ .tab-panels .tab-panel[data-tab="hotel"],
.section-cr #tab-ef-channel:checked ~ .tab-panels .tab-panel[data-tab="channel"],
.section-cr #tab-ef-canasta:checked ~ .tab-panels .tab-panel[data-tab="canasta"]{display:block !important;}
.section-cr #tab-ef-destino:checked ~ .tabs-row label[for="tab-ef-destino"],
.section-cr #tab-ef-corp:checked ~ .tabs-row label[for="tab-ef-corp"],
.section-cr #tab-ef-hotel:checked ~ .tabs-row label[for="tab-ef-hotel"],
.section-cr #tab-ef-channel:checked ~ .tabs-row label[for="tab-ef-channel"],
.section-cr #tab-ef-canasta:checked ~ .tabs-row label[for="tab-ef-canasta"]{background:var(--paper);color:#5C469C;border:1px solid var(--rule);border-bottom:1px solid var(--paper);}

/* ── Tabs KPI Hero · CR · ConvRate (tab-cv-*) ── */
.section-cr #tab-cv-destino:checked ~ .tab-panels .tab-panel[data-tab="destino"],
.section-cr #tab-cv-corp:checked ~ .tab-panels .tab-panel[data-tab="corp"],
.section-cr #tab-cv-hotel:checked ~ .tab-panels .tab-panel[data-tab="hotel"],
.section-cr #tab-cv-channel:checked ~ .tab-panels .tab-panel[data-tab="channel"],
.section-cr #tab-cv-canasta:checked ~ .tab-panels .tab-panel[data-tab="canasta"]{display:block !important;}
.section-cr #tab-cv-destino:checked ~ .tabs-row label[for="tab-cv-destino"],
.section-cr #tab-cv-corp:checked ~ .tabs-row label[for="tab-cv-corp"],
.section-cr #tab-cv-hotel:checked ~ .tabs-row label[for="tab-cv-hotel"],
.section-cr #tab-cv-channel:checked ~ .tabs-row label[for="tab-cv-channel"],
.section-cr #tab-cv-canasta:checked ~ .tabs-row label[for="tab-cv-canasta"]{background:var(--paper);color:#5C469C;border:1px solid var(--rule);border-bottom:1px solid var(--paper);}

/* ── Tabs Hotel CR ── */
.section-cr .tabs-block #tab-h-crit:checked ~ .tab-panels .tab-panel[data-tab="crit"],
.section-cr .tabs-block #tab-h-br:checked ~ .tab-panels .tab-panel[data-tab="br"],
.section-cr .tabs-block #tab-h-sc:checked ~ .tab-panels .tab-panel[data-tab="sc"],
.section-cr .tabs-block #tab-h-mcv:checked ~ .tab-panels .tab-panel[data-tab="mcv"]{display:block !important;}
.section-cr #tab-h-crit:checked ~ .tabs-row label[for="tab-h-crit"],
.section-cr #tab-h-br:checked ~ .tabs-row label[for="tab-h-br"],
.section-cr #tab-h-sc:checked ~ .tabs-row label[for="tab-h-sc"],
.section-cr #tab-h-mcv:checked ~ .tabs-row label[for="tab-h-mcv"]{background:var(--paper);color:#5C469C;border:1px solid var(--rule);border-bottom:1px solid var(--paper);}

/* ── Tabs Dimensión CR ── */
.section-cr .tabs-block #tab-d-corp:checked ~ .tab-panels .tab-panel[data-tab="corp"],
.section-cr .tabs-block #tab-d-dest:checked ~ .tab-panels .tab-panel[data-tab="dest"],
.section-cr .tabs-block #tab-d-chan:checked ~ .tab-panels .tab-panel[data-tab="chan"]{display:block !important;}
.section-cr #tab-d-corp:checked ~ .tabs-row label[for="tab-d-corp"],
.section-cr #tab-d-dest:checked ~ .tabs-row label[for="tab-d-dest"],
.section-cr #tab-d-chan:checked ~ .tabs-row label[for="tab-d-chan"]{background:var(--paper);color:#5C469C;border:1px solid var(--rule);border-bottom:1px solid var(--paper);}

/* ── Tabs KPI Hero · RND · NoDispo (tab-nd-*) y IPM (tab-rpm-*) ── */
.section-rnd #tab-nd-pais:checked ~ .tab-panels .tab-panel[data-tab="pais"],
.section-rnd #tab-nd-destino:checked ~ .tab-panels .tab-panel[data-tab="destino"],
.section-rnd #tab-nd-corp:checked ~ .tab-panels .tab-panel[data-tab="corp"],
.section-rnd #tab-nd-hotel:checked ~ .tab-panels .tab-panel[data-tab="hotel"],
.section-rnd #tab-nd-canasta:checked ~ .tab-panels .tab-panel[data-tab="canasta"],
.section-rnd #tab-rpm-pais:checked ~ .tab-panels .tab-panel[data-tab="pais"],
.section-rnd #tab-rpm-destino:checked ~ .tab-panels .tab-panel[data-tab="destino"],
.section-rnd #tab-rpm-corp:checked ~ .tab-panels .tab-panel[data-tab="corp"],
.section-rnd #tab-rpm-hotel:checked ~ .tab-panels .tab-panel[data-tab="hotel"],
.section-rnd #tab-rpm-canasta:checked ~ .tab-panels .tab-panel[data-tab="canasta"]{display:block;}
.section-rnd #tab-nd-destino:checked ~ .tabs-row label[for="tab-nd-destino"],
.section-rnd #tab-nd-corp:checked ~ .tabs-row label[for="tab-nd-corp"],
.section-rnd #tab-nd-hotel:checked ~ .tabs-row label[for="tab-nd-hotel"],
.section-rnd #tab-nd-canasta:checked ~ .tabs-row label[for="tab-nd-canasta"],
.section-rnd #tab-nd-channel:checked ~ .tabs-row label[for="tab-nd-channel"],
.section-rnd #tab-rpm-destino:checked ~ .tabs-row label[for="tab-rpm-destino"],
.section-rnd #tab-rpm-corp:checked ~ .tabs-row label[for="tab-rpm-corp"],
.section-rnd #tab-rpm-hotel:checked ~ .tabs-row label[for="tab-rpm-hotel"],
.section-rnd #tab-rpm-canasta:checked ~ .tabs-row label[for="tab-rpm-canasta"],
.section-rnd #tab-rpm-channel:checked ~ .tabs-row label[for="tab-rpm-channel"]{background:var(--paper);color:#EA0074;border:1px solid var(--rule);border-bottom:1px solid var(--paper);}

/* ── Tabs Hotel RND ── */
.section-rnd .tabs-block #tab-h-crit:checked ~ .tab-panels .tab-panel[data-tab="crit"],
.section-rnd .tabs-block #tab-h-dnc:checked ~ .tab-panels .tab-panel[data-tab="dnc"],
.section-rnd .tabs-block #tab-h-br:checked ~ .tab-panels .tab-panel[data-tab="br"],
.section-rnd .tabs-block #tab-h-sc:checked ~ .tab-panels .tab-panel[data-tab="sc"]{display:block !important;}
.section-rnd #tab-h-crit:checked ~ .tabs-row label[for="tab-h-crit"],
.section-rnd #tab-h-dnc:checked ~ .tabs-row label[for="tab-h-dnc"],
.section-rnd #tab-h-br:checked ~ .tabs-row label[for="tab-h-br"],
.section-rnd #tab-h-sc:checked ~ .tabs-row label[for="tab-h-sc"]{background:var(--paper);color:#EA0074;border:1px solid var(--rule);border-bottom:1px solid var(--paper);}

/* ── Tabs Dimensión RND ── */
.section-rnd .tabs-block #tab-d-corp:checked ~ .tab-panels .tab-panel[data-tab="corp"],
.section-rnd .tabs-block #tab-d-dest:checked ~ .tab-panels .tab-panel[data-tab="dest"],
.section-rnd .tabs-block #tab-d-pais:checked ~ .tab-panels .tab-panel[data-tab="pais"]{display:block !important;}
.section-rnd #tab-d-corp:checked ~ .tabs-row label[for="tab-d-corp"],
.section-rnd #tab-d-dest:checked ~ .tabs-row label[for="tab-d-dest"],
.section-rnd #tab-d-pais:checked ~ .tabs-row label[for="tab-d-pais"]{background:var(--paper);color:#EA0074;border:1px solid var(--rule);border-bottom:1px solid var(--paper);}

/* ── kpi-card tabs · scope CR ── */
.section-cr .kpi-card input[type="radio"][id*="-pais"]:checked ~ .tabs-row label[for*="-pais"],
.section-cr .kpi-card input[type="radio"][id*="-destino"]:checked ~ .tabs-row label[for*="-destino"],
.section-cr .kpi-card input[type="radio"][id*="-corp"]:checked ~ .tabs-row label[for*="-corp"],
.section-cr .kpi-card input[type="radio"][id*="-hotel"]:checked ~ .tabs-row label[for*="-hotel"],
.section-cr .kpi-card input[type="radio"][id*="-canasta"]:checked ~ .tabs-row label[for*="-canasta"],
.section-cr .kpi-card input[type="radio"][id*="-channel"]:checked ~ .tabs-row label[for*="-channel"]{
  background:var(--paper); color:#5C469C; border:1px solid var(--rule); border-bottom:1px solid var(--paper);
}
.section-cr .kpi-card input[type="radio"][id*="-pais"]:checked ~ .tab-panels .tab-panel[data-tab="pais"],
.section-cr .kpi-card input[type="radio"][id*="-destino"]:checked ~ .tab-panels .tab-panel[data-tab="destino"],
.section-cr .kpi-card input[type="radio"][id*="-corp"]:checked ~ .tab-panels .tab-panel[data-tab="corp"],
.section-cr .kpi-card input[type="radio"][id*="-hotel"]:checked ~ .tab-panels .tab-panel[data-tab="hotel"],
.section-cr .kpi-card input[type="radio"][id*="-canasta"]:checked ~ .tab-panels .tab-panel[data-tab="canasta"],
.section-cr .kpi-card input[type="radio"][id*="-channel"]:checked ~ .tab-panels .tab-panel[data-tab="channel"]{display:block;width:100%;}

/* ── kpi-card tabs · scope RND ── */
.section-rnd .kpi-card input[type="radio"][id*="-pais"]:checked ~ .tabs-row label[for*="-pais"],
.section-rnd .kpi-card input[type="radio"][id*="-destino"]:checked ~ .tabs-row label[for*="-destino"],
.section-rnd .kpi-card input[type="radio"][id*="-corp"]:checked ~ .tabs-row label[for*="-corp"],
.section-rnd .kpi-card input[type="radio"][id*="-hotel"]:checked ~ .tabs-row label[for*="-hotel"],
.section-rnd .kpi-card input[type="radio"][id*="-canasta"]:checked ~ .tabs-row label[for*="-canasta"],
.section-rnd .kpi-card input[type="radio"][id*="-channel"]:checked ~ .tabs-row label[for*="-channel"]{
  background:var(--paper); color:#EA0074; border:1px solid var(--rule); border-bottom:1px solid var(--paper);
}
.section-rnd .kpi-card input[type="radio"][id*="-pais"]:checked ~ .tab-panels .tab-panel[data-tab="pais"],
.section-rnd .kpi-card input[type="radio"][id*="-destino"]:checked ~ .tab-panels .tab-panel[data-tab="destino"],
.section-rnd .kpi-card input[type="radio"][id*="-corp"]:checked ~ .tab-panels .tab-panel[data-tab="corp"],
.section-rnd .kpi-card input[type="radio"][id*="-hotel"]:checked ~ .tab-panels .tab-panel[data-tab="hotel"],
.section-rnd .kpi-card input[type="radio"][id*="-canasta"]:checked ~ .tab-panels .tab-panel[data-tab="canasta"],
.section-rnd .kpi-card input[type="radio"][id*="-channel"]:checked ~ .tab-panels .tab-panel[data-tab="channel"]{display:block;width:100%;}

/* ── Switcher · barra de navegación entre reportes ── */
.report-switcher {
  display: flex;
  gap: 0;
  margin: 0 0 0;
  border-bottom: 3px solid var(--ink);
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--paper);
  padding: 12px 32px 0;
  margin: 0 -32px;   /* sangra al ancho del shell */
}
.switcher-btn {
  padding: 10px 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .10em;
  text-transform: uppercase;
  cursor: pointer;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  background: transparent;
  color: var(--ink-muted);
  font-family: 'Geist', system-ui, sans-serif;
  transition: all .15s;
  margin-bottom: -3px;
  user-select: none;
}
.switcher-btn:hover { color: var(--ink-soft); background: var(--rule-soft); border-color: var(--rule-soft); }
.switcher-btn.active-cr  { background: var(--paper); color: #5C469C; border-color: var(--rule); border-bottom-color: var(--paper); }
.switcher-btn.active-rnd { background: var(--paper); color: #EA0074; border-color: var(--rule); border-bottom-color: var(--paper); }

/* ── Back al hub ── */
.back-hub {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  text-decoration: none;
  padding: 8px 0 12px;
  transition: color .15s;
}
.back-hub:hover { color: var(--ink); }
.back-hub svg { flex-shrink: 0; }

/* ── Secciones de reporte: hidden/visible ── */
.report-section { display: none; }
.report-section.visible { display: block; }

/* ── Divisor visual entre secciones ── */
.section-divider {
  height: 4px;
  background: linear-gradient(90deg, #EA0074 0%, #5C469C 100%);
  margin: 0 -32px 0;
}

/* ── Tab labels dinámicos (usados en w22-ph, w22-pd) ── */
.tab-label {
  padding: 8px 14px;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  cursor: pointer;
  border-radius: 6px 6px 0 0;
  border: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  background: var(--paper-soft);
  margin-bottom: -1px;
  transition: background .15s, color .15s, border-color .15s;
}
.tab-label:hover {
  color: var(--accent);
}
.tab-label.active {
  background: var(--paper);
  color: var(--accent);
  border-bottom: 1px solid var(--paper);
}
</style>
{{SHARED_HEAD}}
</head>
